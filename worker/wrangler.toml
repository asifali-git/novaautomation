name = "novaautomation"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Every 5 min: wake fastpoll (Render free tier sleeps after 15 min idle).
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://novaautomation.pages.dev"
PUBLIC_BASE_URL = "https://novaautomation.asifaliasmr05.workers.dev"
GH_REPO = "asifali-git/novaautomation"

[[d1_databases]]
binding = "DB"
database_name = "novaautomation"
database_id = "fa427fe6-1886-44d1-b408-d4bfe0467705"
