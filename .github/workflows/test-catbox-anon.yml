name: test-catbox-anon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test anonymous Catbox upload
        run: |
          python3 -c '
          import requests
          for i in range(3):
              r = requests.post("https://catbox.moe/user/api.php",
                  data={"reqtype":"fileupload"},
                  files={"fileToUpload":("t.txt", b"hello", "text/plain")}, timeout=60)
              print("attempt", i+1, "status", r.status_code, "response", repr(r.text[:150]))
          '
