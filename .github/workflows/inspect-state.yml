name: inspect-state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Videos
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute novaautomation --remote --command="SELECT v.id,v.task_id,v.status,v.url FROM videos v ORDER BY v.id;"
      - name: Tasks
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute novaautomation --remote --command="SELECT t.id,t.name,t.platform,t.status,t.source_url FROM tasks t ORDER BY t.id;"
