name: process

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: 'Comma-separated video ids (empty = next detected)'
        required: false
        default: ''
      manual_job_id:
        description: 'Manual upload job ID (from Quick Upload)'
        required: false
        default: ''
  workflow_call:
    inputs:
      video_ids:
        description: 'Comma-separated video ids'
        required: false
        type: string
        default: ''
      manual_job_id:
        description: 'Manual upload job ID'
        required: false
        type: string
        default: ''

concurrency:
  group: process
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          pip install -q -r pipeline/requirements.txt

      - name: Install Chrome (for social upload)
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable xvfb

      - name: Decode cookies
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          if [ -n "$COOKIE_B64" ]; then
            echo "$COOKIE_B64" | base64 -d > cookies.txt
            echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Fetch channel auth from hub
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          resp=$(curl -s -H "x-token: $INTERNAL_TOKEN" "$WORKER_URL/api/internal/logins/env")
          get() { echo "$resp" | python -c "import sys,json;print(json.load(sys.stdin).get('$1') or '')"; }
          rt=$(get YT_REFRESH_TOKEN); cid=$(get YT_CLIENT_ID); cs=$(get YT_CLIENT_SECRET)
          [ -n "$rt" ] && echo "::add-mask::$rt"
          [ -n "$cid" ] && echo "::add-mask::$cid"
          [ -n "$cs" ] && echo "::add-mask::$cs"
          echo "YT_REFRESH_TOKEN=$rt" >> "$GITHUB_ENV"
          echo "YT_CLIENT_ID=$cid" >> "$GITHUB_ENV"
          echo "YT_CLIENT_SECRET=$cs" >> "$GITHUB_ENV"

      - name: Fetch API keys from hub
        continue-on-error: true
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: python pipeline/hub_keys.py

      - name: Process manual upload
        if: ${{ inputs.manual_job_id != '' }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          MAX_SECS: ${{ vars.MAX_SECS || '200' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGES_JSON: ${{ secrets.FB_PAGES_JSON }}
          YT_API_URL: ${{ secrets.YT_API_URL }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FASTSAVER_API_KEY: ${{ secrets.FASTSAVER_API_KEY }}
        run: |
          echo "=== Processing manual job ${{ inputs.manual_job_id }} ==="
          MANUAL_JOB_ID="${{ inputs.manual_job_id }}" python pipeline/manual_upload.py

      - name: Process videos
        if: ${{ inputs.manual_job_id == '' }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANALYZE: ${{ vars.ANALYZE || 'true' }}
          VOICEOVER: ${{ vars.VOICEOVER || 'true' }}
          MAX_SECS: ${{ vars.MAX_SECS || '60' }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          FB_PAGE_URL: ${{ vars.FB_PAGE_URL || '' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGES_JSON: ${{ secrets.FB_PAGES_JSON }}
          YT_API_URL: ${{ secrets.YT_API_URL }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FASTSAVER_API_KEY: ${{ secrets.FASTSAVER_API_KEY }}
        run: |
          ids="${{ inputs.video_ids }}"
          if [ -z "$ids" ]; then
            echo "No ids given; processing next detected video."
            python pipeline/main.py
          else
            IFS=',' read -ra arr <<< "$ids"
            for id in "${arr[@]}"; do
              id=$(echo "$id" | xargs)
              [ -z "$id" ] && continue
              echo "=== Processing video $id ==="
              VIDEO_ID="$id" python pipeline/main.py || echo "video $id failed (continuing)"
            done
          fi

      - name: Commit fact vault usage
        if: ${{ always() }}
        continue-on-error: true
        run: |
          git config user.name "nova-factbot"
          git config user.email "nova-factbot@users.noreply.github.com"
          git add pipeline/facts/*.json pipeline/title_history.json
          if git diff --cached --quiet; then exit 0; fi
          git pull --rebase origin master
          git commit -m "facts: usage update"
          git push origin master
