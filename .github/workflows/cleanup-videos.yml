name: cleanup-youtube-video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute novaautomation --remote --command="DELETE FROM videos; DELETE FROM deliveries; SELECT COUNT(*) AS videos FROM videos;"
