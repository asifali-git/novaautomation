name: poll

# Polling is done by the Render fast-poller (fastpoll.py, every 8-15s) which
# dispatches process.yml directly — no scheduled GH run needed.
on:
  workflow_dispatch: {}

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      new_count: ${{ steps.detect.outputs.new_count }}
      video_ids: ${{ steps.detect.outputs.video_ids }}
      manual_job_id: ${{ steps.detect.outputs.manual_job_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q yt-dlp requests

      - name: Decode cookies
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          if [ -n "$COOKIE_B64" ]; then
            echo "$COOKIE_B64" | base64 -d > cookies.txt
            echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Detect new videos + manual jobs
        id: detect
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: python pipeline/poll.py

  dispatch:
    needs: detect
    if: needs.detect.outputs.new_count != '0' || needs.detect.outputs.manual_job_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger processor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manual="${{ needs.detect.outputs.manual_job_id }}"
          if [ -n "$manual" ]; then
            echo "Dispatching manual job $manual"
            gh workflow run process.yml -f manual_job_id="$manual"
          else
            echo "Dispatching videos ${{ needs.detect.outputs.video_ids }}"
            gh workflow run process.yml -f video_ids="${{ needs.detect.outputs.video_ids }}"
          fi
