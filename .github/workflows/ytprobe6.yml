name: ytprobe6
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: false
        default: "https://www.youtube.com/watch?v=GHspQ1PCWNw"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Decode cookies
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          if [ -n "$COOKIE_B64" ]; then
            echo "$COOKIE_B64" | base64 -d > cookies.txt
            echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
            echo "decoded cookies.txt ($(wc -l < cookies.txt) lines)"
          else
            echo "no COOKIE_B64 secret"
          fi
      - name: Probe
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          url = os.environ.get("URL") or "https://www.youtube.com/watch?v=GHspQ1PCWNw"
          ck = os.environ.get("COOKIES_FILE") or ""
          outd = tempfile.mkdtemp(prefix="ytp6_")
          out = os.path.join(outd, "src.mp4")
          def run(label, extra):
              try:
                  p = subprocess.run([sys.executable, "-m", "yt_dlp", "-F", "--no-warnings",
                                      *extra, url],
                                     capture_output=True, text=True, timeout=120)
              except Exception as e:
                  print(f"{label}: EXC {e}"); return
              lines = (p.stdout or "").splitlines()
              real = [l for l in lines if "https" in l and any(c.isdigit() for c in l.split("|")[0])]
              err = [l for l in (p.stderr or "").splitlines() if l.startswith("ERROR")]
              print(f"{label}: rc={p.returncode} real_formats={len(real)}  {err[-1][:110] if err else 'OK'}")
              if real:
                  print("   sample:", real[-1][:90])
          ckb = ["--cookies", ck] if ck and os.path.exists(ck) else []
          run("visionos_nock", ["--extractor-args", "youtube:player_client=visionos"])
          run("visionos_ck", ckb + ["--extractor-args", "youtube:player_client=visionos"])
          run("android_ck", ckb + ["--extractor-args", "youtube:player_client=android"])
          run("web_ck", ckb + ["--extractor-args", "youtube:player_client=web"])
          run("mweb_ck", ckb + ["--extractor-args", "youtube:player_client=mweb"])
          PY
