name: ytprobe8
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: false
        default: "https://www.youtube.com/watch?v=GHspQ1PCWNw"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Decode cookies
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          echo "$COOKIE_B64" | base64 -d > cookies.txt
          echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
          echo "decoded cookies.txt ($(wc -l < cookies.txt) lines)"
      - name: Probe -F and download
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          url = os.environ.get("URL") or "https://www.youtube.com/watch?v=GHspQ1PCWNw"
          ck = os.environ.get("COOKIES_FILE") or ""
          outd = tempfile.mkdtemp(prefix="ytp8_")
          ckb = ["--cookies", ck] if ck and os.path.exists(ck) else []
          
          # First list formats with visionos+ck (rc=0 in ytprobe6)
          print("=== visionos_ck format list ===")
          p = subprocess.run([sys.executable, "-m", "yt_dlp", "-F", "--no-warnings",
                              *ckb, "--extractor-args", "youtube:player_client=visionos", url],
                             capture_output=True, text=True, timeout=120)
          print(p.stdout)
          print("STDERR tail:", (p.stderr or "").splitlines()[-3:] if p.stderr else "none")
          
          # Try download with no selector (default best)
          print("=== visionos_ck download (no selector) ===")
          out = os.path.join(outd, "src.mp4")
          p = subprocess.run([sys.executable, "-m", "yt_dlp", "--no-warnings",
                              *ckb, "--extractor-args", "youtube:player_client=visionos",
                              "-o", out, url],
                             capture_output=True, text=True, timeout=180)
          sz = os.path.getsize(out) if os.path.exists(out) else 0
          err = [l for l in (p.stderr or "").splitlines() if l.startswith("ERROR")]
          print(f"no_selector: rc={p.returncode} file={sz}B  {err[-1][:110] if err else 'OK'}")
PY
