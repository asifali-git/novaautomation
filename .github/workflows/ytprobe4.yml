name: ytprobe4
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: false
        default: "https://www.youtube.com/watch?v=GHspQ1PCWNw"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Probe default client (no selector)
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          url = os.environ.get("URL") or "https://www.youtube.com/watch?v=GHspQ1PCWNw"
          outd = tempfile.mkdtemp(prefix="ytp4_")
          out = os.path.join(outd, "src.mp4")
          def run(label, extra):
              try:
                  p = subprocess.run([sys.executable, "-m", "yt_dlp", "--no-warnings",
                                      *extra, "-o", out, url],
                                     capture_output=True, text=True, timeout=120)
              except Exception as e:
                  print(f"{label}: EXC {e}"); return
              sz = os.path.getsize(out) if os.path.exists(out) else 0
              err = [l for l in (p.stderr or "").splitlines() if l.startswith("ERROR")]
              print(f"{label}: rc={p.returncode} file={sz}B  {err[-1][:110] if err else 'OK'}")
              if os.path.exists(out):
                  os.remove(out)
          run("default_noargs", [])
          run("default_best", ["-f", "best"])
          run("default_bextmp4", ["-f", "b[ext=mp4]/b"])
          run("tv_embedded", ["--extractor-args", "youtube:player_client=tv_embedded"])
          PY
