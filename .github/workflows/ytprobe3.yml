name: ytprobe3
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: false
        default: "https://www.youtube.com/watch?v=GHspQ1PCWNw"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Decode cookies
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          if [ -n "$COOKIE_B64" ]; then
            echo "$COOKIE_B64" | base64 -d > cookies.txt
            echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
          fi
      - name: Probe tv_embedded / mweb / web_creator
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          url = os.environ.get("URL") or "https://www.youtube.com/watch?v=GHspQ1PCWNw"
          ck = os.environ.get("COOKIES_FILE") or ""
          outd = tempfile.mkdtemp(prefix="ytp3_")
          out = os.path.join(outd, "src.mp4")
          def run(label, extra, fmt):
              try:
                  p = subprocess.run(
                      [sys.executable, "-m", "yt_dlp", "-f", fmt, "--no-warnings",
                       *extra, "-o", out, url],
                      capture_output=True, text=True, timeout=150)
              except Exception as e:
                  print(f"{label}: EXC {e}"); return
              sz = os.path.getsize(out) if os.path.exists(out) else 0
              err = [l for l in (p.stderr or "").splitlines() if l.startswith("ERROR")]
              print(f"{label}: rc={p.returncode} file={sz}B  {err[-1][:110] if err else 'OK'}")
          ckb = ["--cookies", ck] if ck and os.path.exists(ck) else []
          for c in ["tv_embedded", "mweb", "web_creator", "web_embedded", "android_vr", "ios"]:
              run(f"{c}_best_nock", ["--extractor-args", f"youtube:player_client={c}"], "best")
              run(f"{c}_best_ck", ckb + ["--extractor-args", f"youtube:player_client={c}"], "best")
          PY
