name: deliver-link

# Manual: deliver a Catbox-hosted file to the NOVA app (FCM push, no social upload).
on:
  workflow_dispatch:
    inputs:
      catbox_url:
        description: 'Catbox URL (https://files.catbox.moe/xxx.mp4)'
        required: true
      title:
        description: 'Video title'
        required: false
        default: 'New video'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Notify worker -> FCM to all devices
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          CATBOX_URL: ${{ inputs.catbox_url }}
          TITLE: ${{ inputs.title }}
        run: |
          pip install -q requests
          python3 -c 'import os,requests; u=os.environ["CATBOX_URL"].strip(); assert u.startswith("https://files.catbox.moe/"), "invalid url"; r=requests.post(os.environ["WORKER_URL"].rstrip("/")+"/api/internal/deliveries",json={"catbox_url":u,"file_name":u.split("/")[-1],"title":os.environ.get("TITLE") or u.split("/")[-1],"platform":"manual","source_url":u,"size_bytes":0,"mime":"video/mp4"},headers={"Authorization":"Bearer "+os.environ["INTERNAL_TOKEN"]},timeout=60); print("worker:",r.status_code,r.text[:300])'
