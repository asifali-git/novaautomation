name: ytprobe
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: false
        default: "https://www.youtube.com/watch?v=GHspQ1PCWNw"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Decode cookies
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          if [ -n "$COOKIE_B64" ]; then
            echo "$COOKIE_B64" | base64 -d > cookies.txt
            echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
            echo "decoded cookies.txt ($(wc -l < cookies.txt) lines)"
          else
            echo "no COOKIE_B64 secret"
          fi
      - name: Probe yt clients from runner IP
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          url = os.environ.get("URL") or "https://www.youtube.com/watch?v=GHspQ1PCWNw"
          ck = os.environ.get("COOKIES_FILE") or ""
          outd = tempfile.mkdtemp(prefix="ytp_")
          fmts = [("dash", "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b"),
                  ("prog", "b[ext=mp4]/b"),
                  ("any", "bv*+ba/b")]
          combos = []
          for c in ["web", "visionos", "android", "tv", "ios"]:
              for fk, fv in fmts:
                  if ck and os.path.exists(ck):
                      combos.append((f"{c}_ck_{fk}", ["--cookies", ck, "--extractor-args", f"youtube:player_client={c}"], fv))
              combos.append((f"{c}_nock_dash", ["--extractor-args", f"youtube:player_client={c}"], fmts[0][1]))
          def probe(label, args, fmt):
              out = os.path.join(outd, "src.mp4")
              try:
                  p = subprocess.run([sys.executable, "-m", "yt_dlp", "-f", fmt, "--no-warnings",
                                      *args, "-o", out, "--max-filesize", "50M", url],
                                     capture_output=True, text=True, timeout=150)
              except Exception as e:
                  print(f"{label}: EXC {e}"); return
              sz = os.path.getsize(out) if os.path.exists(out) else 0
              err = [l for l in (p.stderr or "").splitlines() if l.startswith("ERROR")]
              print(f"{label}: rc={p.returncode} file={sz}B  {err[-1][:100] if err else ''}")
          for label, args, fmt in combos:
              probe(label, args, fmt)
          PY
